# Builds the debug app and runs the unit tests on every pull request to dev or main,
# with the extractor pinned in tools/upstream/pins.properties, as the release build does.
name: PR checks

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: PipePipeClient
          persist-credentials: false

      - name: Read the pinned extractor
        id: pins
        run: |
          extractor=$(sed -n 's/^extractor=//p' PipePipeClient/tools/upstream/pins.properties)
          if [ -z "$extractor" ]; then echo "::error::No extractor in pins.properties"; exit 1; fi
          echo "extractor=$extractor" >> "$GITHUB_OUTPUT"

      - name: Check out the extractor
        uses: actions/checkout@v4
        with:
          repository: InfinityLoop1308/PipePipeExtractor
          ref: ${{ steps.pins.outputs.extractor }}
          path: PipePipeExtractor
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run the unit tests
        working-directory: PipePipeClient
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Test the release and upstream tools
        working-directory: PipePipeClient
        run: |
          python3 -m unittest discover -s tools/upstream
          python3 -m unittest discover -s tools/release
