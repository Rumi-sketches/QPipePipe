// QPipePipe identity: app id, name, version, and where updates, announcements and bug
// reports come from and go to. Kept out of build.gradle so upstream merges only touch
// upstream lines. Applied at the end of build.gradle, so the values set here override
// upstream's.
//
// A fork of QPipePipe changes the three values below (see FORK.md, Forking QPipePipe).
def qpipepipeApplicationId = "io.github.rumisketches.qpipepipe"
// GitHub "owner/repo": releases for the update check, wiki announcements, issues.
def qpipepipeGithubRepo = "Rumi-sketches/QPipePipe"
// Address of the bug reports sent from the error screen.
def qpipepipeContactEmail = "rumi.sketches@outlook.com"

// Versions are "<upstream version>-q<N>", e.g. 5.4.0-q1. Bump qpipepipeRelease for every
// fork release and reset it to 1 when merging a new upstream release.
def qpipepipeRelease = 1

def upstreamVersionName = android.defaultConfig.versionName
def upstreamVersionCode = android.defaultConfig.versionCode
def abiCodes = ['armeabi-v7a': 1, 'x86': 2, 'x86_64': 3, 'arm64-v8a': 4]
def qpipepipeVersionName = "${upstreamVersionName}-q${qpipepipeRelease}"
// Upstream raises its version code by one per release, beta included. Multiplying by 1000
// leaves room for 99 fork releases per upstream release and one digit for the ABI.
def qpipepipeVersionCode = upstreamVersionCode * 1000 + qpipepipeRelease * 10

android {
    defaultConfig {
        applicationId qpipepipeApplicationId
        buildConfigField "String", "QPIPEPIPE_GITHUB_REPO", "\"${qpipepipeGithubRepo}\""
        buildConfigField "String", "QPIPEPIPE_CONTACT_EMAIL", "\"${qpipepipeContactEmail}\""
        versionName qpipepipeVersionName
        versionCode qpipepipeVersionCode
    }

    buildTypes {
        debug {
            resValue "string", "app_name", "QPipePipe Debug"
        }
        release {
            if (System.properties.containsKey('packageSuffix')) {
                resValue "string", "app_name", "QPipePipe " + System.getProperty('packageSuffix')
            } else {
                resValue "string", "app_name", "QPipePipe"
            }
        }
    }
}

// Scripts applied with "apply from" do not see the Android Gradle Plugin classes,
// so load BuildConfigField through the plugin's class loader.
def buildConfigFieldClass = android.class.classLoader
        .loadClass("com.android.build.api.variant.BuildConfigField")

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.buildConfigFields.put(
            "VERSION_CODE",
            buildConfigFieldClass.newInstance(
                    "int", qpipepipeVersionCode + abiCodes['armeabi-v7a'],
                    "Stable across ABI splits; use PackageManager at runtime."))

    variant.outputs.each { output ->
        def outputFileName = output.outputFileName.get()
        def abi = abiCodes.keySet().sort { -it.length() }.find { outputFileName.contains(it) }
        def versionCode = qpipepipeVersionCode
        if (abi != null) {
            versionCode += abiCodes[abi]
        }
        output.versionCode.set(versionCode)
        output.outputFileName.set(
                "QPipePipe_${qpipepipeVersionName}-${abi ?: 'universal'}-${variant.name}.apk")
    }
}
